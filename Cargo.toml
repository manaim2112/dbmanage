[package]
name = "dbmanage"
version = "0.1.0"
edition = "2021"
description = "Multi-database management platform (MariaDB & PostgreSQL)"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
askama = "0.12"
axum = "0.8"
base32 = "0.5"
bcrypt = "0.16"
futures = "0.3"
hex = "0.4"
qrcode = { version = "0.14", features = ["svg"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
totp-rs = "5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
