[package]
name = "dbmanage"
version = "0.1.0"
edition = "2021"
description = "Multi-database management platform (MariaDB & PostgreSQL)"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
askama = "0.12"
aws-credential-types = "1"
aws-sdk-s3 = "1"
axum = "0.8"
base32 = "0.5"
bcrypt = "0.16"
chrono = "0.4"
flate2 = "1"
futures = "0.3"
hex = "0.4"
qrcode = { version = "0.14", features = ["svg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "form", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "postgres", "chrono", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "fs"] }
totp-rs = "5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[profile.release]
lto = true
strip = true
